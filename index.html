<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acteurs plastiques</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --sidebar-w: 230px;
      --navbar-h:  50px;
      --green:     #4caf50;
      --green-d:   #388e3c;
      --blue:      #1976d2;
      --text:      #333;
      --muted:     #777;
      --border:    #e0e0e0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── NAVBAR ── */
    #navbar {
      height: var(--navbar-h);
      background: #1e2d4d;
      display: flex;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      z-index: 3000;
      gap: 16px;
    }
    #nav-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      margin-right: auto;
      white-space: nowrap;
    }

    /* View toggle */
    #view-toggle {
      display: flex;
      gap: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 3px;
    }
    .view-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.65);
      padding: 5px 13px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .view-btn.active  { background: rgba(255,255,255,0.22); color: #fff; }
    .view-btn:hover:not(.active) { color: #fff; }

    /* ── MAIN ── */
    #main { flex: 1; display: flex; overflow: hidden; }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100%;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .3s, min-width .3s;
      position: relative;
      z-index: 1000;
    }
    #sidebar.collapsed { width: 0; min-width: 0; }

    /* Search */
    #search-wrap {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #search-input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      background: #f8f8f8;
      color: var(--text);
      transition: border-color .2s;
      min-width: 0;
    }
    #search-input:focus { border-color: var(--blue); background: #fff; }
    #search-input::placeholder { color: #aaa; }
    #geo-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--blue);
      padding: 3px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    #collapse-btn {
      background: #fff;
      border: 1px solid var(--border);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.58rem;
      color: #999;
      flex-shrink: 0;
      transition: border-color .2s, color .2s;
    }
    #collapse-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* Filters */
    #filters { flex: 1; overflow-y: auto; scrollbar-width: thin; }

    .filter-section { border-bottom: 1px solid var(--border); }

    .section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: #f7f7f7;
      border-bottom: 1px solid var(--border);
    }
    .section-hdr-title {
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #555;
    }
    .master-cb {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: var(--green);
    }

    .filter-row {
      display: flex;
      align-items: center;
      padding: 7px 12px;
      gap: 9px;
      transition: background .1s;
    }
    .filter-row:hover { background: #f5f5f5; }

    .filter-cb {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--green);
      flex-shrink: 0;
    }
    .type-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }
    .type-badge svg { width: 16px; height: 16px; }
    .filter-name {
      flex: 1;
      font-size: 0.83rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .filter-count {
      font-size: 0.72rem;
      color: #999;
      flex-shrink: 0;
      min-width: 16px;
      text-align: right;
    }
    .solo-btn {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: border-color .2s;
    }
    .solo-btn:hover { border-color: var(--blue); background: #e3f2fd; }

    /* Footer */
    #sidebar-foot {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: #fafafa;
      flex-shrink: 0;
    }
    #results-count { font-size: .74rem; color: #666; margin-bottom: 6px; }
    #results-count strong { color: var(--text); font-weight: 600; }
    #reset-btn {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px;
      font-size: .72rem;
      font-family: inherit;
      color: #666;
      cursor: pointer;
      transition: all .2s;
    }
    #reset-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* ── MAP AREA ── */
    #map-container { flex: 1; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    #expand-btn {
      display: none;
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 600;
      width: 20px;
      height: 48px;
      background: #fff;
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: .6rem;
      color: #999;
      box-shadow: 2px 0 6px rgba(0,0,0,.1);
    }
    #expand-btn.visible { display: flex; }

    /* ── BASEMAP CONTROL ── */
    #basemap-ctrl {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 500;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.14);
      overflow: hidden;
    }
    .basemap-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      font-size: .77rem;
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      color: var(--text);
      transition: background .1s;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .basemap-opt:last-child { border-bottom: none; }
    .basemap-opt:hover:not(.active) { background: #f5f5f5; }
    .basemap-opt.active { background: #e8f0fd; color: var(--blue); font-weight: 600; }
    .bm-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid currentColor;
      flex-shrink: 0;
    }
    .basemap-opt.active .bm-dot { background: var(--blue); }

    /* ── PANEL SHARED ── */
    .view-panel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 400;
      overflow-y: auto;
      background: #f4f5f7;
    }
    .view-panel.open { display: block; }

    .panel-hdr {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      z-index: 10;
      font-size: .82rem;
      color: #666;
    }
    .panel-hdr strong { color: var(--text); }

    /* ── LIST (CARDS) PANEL ── */
    #cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      padding: 14px 16px;
    }

    .actor-card {
      background: #fff;
      border-radius: 10px;
      border-left: 4px solid #ccc;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      padding: 13px 14px;
      cursor: default;
      transition: box-shadow .15s, transform .1s;
    }
    .actor-card:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,.13);
      transform: translateY(-1px);
    }
    .card-nom   { font-weight: 600; font-size: .88rem; color: #1e293b; margin-bottom: 3px; }
    .card-type  { font-size: .72rem; color: #64748b; margin-bottom: 7px; }
    .card-info  { font-size: .74rem; color: #888; display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .card-resines { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .card-res-badge {
      font-size: .64rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #64748b;
      text-transform: uppercase;
    }

    /* ── TABLE PANEL ── */
    #table-panel { background: #fff; }
    #data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
    }
    #data-table th {
      position: sticky;
      top: 43px;
      background: #f5f5f5;
      text-align: left;
      padding: 9px 12px;
      border-bottom: 2px solid var(--border);
      font-weight: 600;
      color: #555;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    #data-table th:hover { background: #ececec; }
    #data-table th .sort-icon { margin-left: 4px; opacity: .4; font-size: .7rem; }
    #data-table th.sort-asc  .sort-icon { opacity: 1; }
    #data-table th.sort-desc .sort-icon { opacity: 1; }
    #data-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    #data-table tr:hover td { background: #fafafa; }
    .lt-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* ── MULTI-CATEGORY MARKER ── */
    .multi-marker { display: flex; flex-direction: column; align-items: center; }
    .mm-row {
      display: flex;
      gap: 3px;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.35));
    }
    .mm-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: transform .12s ease;
    }
    .mm-badge svg { width: 18px; height: 18px; }
    .leaflet-marker-icon:hover .mm-badge { transform: translateY(-2px); }

    .mm-name-tip.leaflet-tooltip {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 4px 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(0,0,0,.25);
      white-space: nowrap;
    }
    .mm-name-tip.leaflet-tooltip::before { display: none; }

    /* ── LEGEND ── */
    #legend {
      position: absolute;
      bottom: 22px;
      left: 12px;
      z-index: 500;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.14);
      font-size: .76rem;
      max-width: 220px;
      overflow: hidden;
    }
    #legend-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 11px;
      cursor: pointer;
      font-weight: 700;
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #555;
      background: #f7f7f7;
      user-select: none;
    }
    #legend-hdr:hover { background: #eee; }
    #legend-body { padding: 8px 10px; display: grid; gap: 6px; }
    #legend.collapsed #legend-body { display: none; }
    #legend.collapsed #legend-chevron { transform: rotate(-90deg); }
    .leg-row { display: flex; align-items: center; gap: 8px; }
    .leg-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .leg-badge svg { width: 13px; height: 13px; }
    .leg-label { font-size: .76rem; color: var(--text); }

    /* ── POPUP ── */
    .custom-popup .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      padding: 0;
      overflow: hidden;
    }
    .custom-popup .leaflet-popup-content { margin: 0; width: 260px !important; }
    .custom-popup .leaflet-popup-tip { background: #fff; }
    .pop-header { padding: 11px 13px 10px; border-left: 4px solid var(--pop-color, #1976d2); }
    .pop-nom { font-weight: 600; font-size: .95rem; color: #1e293b; margin-bottom: 6px; }
    .pop-types { display: flex; flex-wrap: wrap; gap: 6px; }
    .pop-type-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 4px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
      color: #fff;
    }
    .pop-type-chip .ptc-ico {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pop-type-chip svg { width: 11px; height: 11px; }
    .pop-body { padding: 8px 13px 12px; border-top: 1px solid #e2e8f0; }
    .pop-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 5px; font-size: .77rem; color: #64748b; }
    .pop-resines { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .res-badge {
      font-size: .67rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #64748b;
      text-transform: uppercase;
    }
    .pop-link { display: inline-block; margin-top: 8px; font-size: .74rem; color: #1976d2; text-decoration: none; word-break: break-all; }
    .pop-link:hover { text-decoration: underline; }

    /* ── ACTIVE FILTER CHIPS (above map) ── */
    #active-chips {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 200px;
      z-index: 500;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      pointer-events: none;
    }
    #active-chips:empty { display: none; }
    .filter-chip {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 10px;
      background: rgba(255,255,255,.95);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: .73rem;
      font-weight: 500;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      max-width: 260px;
    }
    .filter-chip .chip-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .filter-chip .chip-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .filter-chip .chip-x {
      background: none;
      border: none;
      cursor: pointer;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: .9rem;
      line-height: 1;
      padding: 0;
      transition: background .12s, color .12s;
    }
    .filter-chip .chip-x:hover { background: #fee2e2; color: #dc2626; }
    .filter-chip.chip-search { background: #fff7ed; border-color: #fed7aa; }
    .filter-chip.chip-radius { background: #eff6ff; border-color: #bfdbfe; }

    /* ── PROXIMITY SECTION (sidebar) ── */
    #proximity-section {
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      background: #fafbfc;
      flex-shrink: 0;
    }
    .prox-hdr {
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #555;
      margin-bottom: 6px;
    }
    .prox-row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
    #prox-input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 14px;
      padding: 5px 9px;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
      background: #fff;
      min-width: 0;
    }
    #prox-input:focus { border-color: var(--blue); }
    #prox-apply, #prox-clear {
      background: none;
      border: 1px solid var(--border);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      font-size: .75rem;
    }
    #prox-apply:hover { border-color: var(--blue); background: #e3f2fd; }
    #prox-clear { color: #999; }
    #prox-clear:hover { border-color: #dc2626; color: #dc2626; background: #fee2e2; }
    .prox-radius-row { display: flex; align-items: center; gap: 8px; font-size: .73rem; color: #666; }
    #prox-radius { flex: 1; accent-color: var(--blue); cursor: pointer; }
    #prox-radius-val { font-weight: 600; color: var(--text); min-width: 38px; text-align: right; }
    #prox-status { font-size: .68rem; color: #999; margin-top: 4px; min-height: 1em; }
    #prox-status.error { color: #dc2626; }
    #prox-status.ok { color: var(--green-d); }

    /* ── CSV EXPORT BUTTON (table header) ── */
    .panel-hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #csv-export-btn {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: .74rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    #csv-export-btn:hover { background: var(--green-d); }

    /* Distance column visibility (toggled when radius filter is active) */
    .col-distance { display: none; }
    body.has-radius .col-distance { display: table-cell; }

    /* ── MOBILE ── */
    #toggle-btn {
      display: none;
      position: fixed;
      bottom: 18px;
      left: 18px;
      z-index: 4000;
      background: #1e2d4d;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0; top: var(--navbar-h);
        height: calc(100vh - var(--navbar-h));
        transform: translateX(-100%);
        width: var(--sidebar-w) !important;
        min-width: var(--sidebar-w) !important;
      }
      #sidebar.open { transform: translateX(0); }
      #toggle-btn { display: flex; }
      #collapse-btn, #expand-btn { display: none !important; }
      #view-toggle .view-btn span { display: none; }
    }
  </style>
</head>
<body>

<!-- ═══ NAVBAR ═══ -->
<nav id="navbar">
  <div id="nav-title">Acteurs plastiques</div>

  <div id="view-toggle">
    <button class="view-btn active" data-view="carte">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
        <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
      </svg>
      <span>Carte</span>
    </button>
    <button class="view-btn" data-view="liste">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

<script>
/* ════════════════════════════════════════
   CONFIG
════════════════════════════════════════ */
const CONFIG = {
  dataUrl: 'data/acteurs.json',
  mapCenter: [49.1, 0.3],
  mapZoom: 8,
  filterFields: [
    { key: 'type_acteur', label: "TYPE D'ACTEUR",           isArray: true },
    { key: 'type_resine', label: 'TYPE DE RÉSINE GÉRÉE(S)', isArray: true }
  ],
  acteurConfig: {
    'Trieur':       { color: '#d97706', label: 'Trieur' },
    'Broyeur':      { color: '#166534', label: 'Broyeur' },
    'Recycleur':    { color: '#15803d', label: 'Recycleur' },
    'Négociant':    { color: '#ca8a04', label: 'Négociant' },
    'Plasturgiste': { color: '#1e40af', label: 'Plasturgiste' },
    'Collecteur':   { color: '#0d9488', label: 'Collecteur' },
    'Autres':       { color: '#6b7280', label: 'Autres' },
    'default':      { color: '#6b7280', label: '?' }
  }
};

/* SVG inner paths (24x24 viewBox), drawn with stroke=currentColor */
const ACTEUR_SVG = {
  'Trieur':       '<path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/>',
  'Broyeur':      '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  'Recycleur':    '<path d="M7 19H4a1 1 0 01-.86-1.51l3-5M12 4.5l2.5 4.3M9.6 12.7l-2.4-4.2 2.4-4.2M21.86 17.49l-3-5M16 21.5l-5-1.34M16.5 13.3l-2.4 4.2-4.85.01"/>',
  'Négociant':    '<path d="M17 6.5C15.6 5 13.85 4.25 12 4.25c-4.28 0-7.75 3.47-7.75 7.75s3.47 7.75 7.75 7.75c1.85 0 3.6-.75 5-2.25M3 10h9M3 14h9"/>',
  'Plasturgiste': '<path d="M12 3l8 5v8l-8 5-8-5V8l8-5z"/><path d="M12 3v18M4 8l16 8M20 8L4 16" stroke-opacity=".5"/>',
  'Collecteur':   '<path d="M1 16V5a1 1 0 011-1h12v12M14 9h4l3 3v4h-3M5.5 19a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM17.5 19a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/>',
  'Autres':       '<circle cx="6" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/>'
};

function iconSvg(name, opts = {}) {
  const inner = ACTEUR_SVG[name] || ACTEUR_SVG['Autres'];
  const sw = opts.strokeWidth || 2;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

/* Stable sort order for type_acteur badges */
const ACTEUR_ORDER = ['Collecteur','Trieur','Broyeur','Recycleur','Plasturgiste','Négociant','Autres'];
function sortTypes(types) {
  return [...(types || [])].sort((a,b) => {
    const ia = ACTEUR_ORDER.indexOf(a); const ib = ACTEUR_ORDER.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
}

/* ════════════════════════════════════════
   MAP INIT
════════════════════════════════════════ */
const map = L.map('map').setView(CONFIG.mapCenter, CONFIG.mapZoom);

const basemaps = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> France',
    maxZoom: 20
  }),
  carto: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> © <a href="https://carto.com">CARTO</a>',
    maxZoom: 20
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri, Maxar, GeoEye, Earthstar Geographics',
    maxZoom: 18
  })
};

let currentBasemap = 'osm';
basemaps.osm.addTo(map);

const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 60 });
map.addLayer(clusterGroup);

/* Basemap switcher */
document.querySelectorAll('.basemap-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    const bm = btn.dataset.bm;
    if (bm === currentBasemap) return;
    map.removeLayer(basemaps[currentBasemap]);
    map.addLayer(basemaps[bm]);
    currentBasemap = bm;
    document.querySelectorAll('.basemap-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

/* ════════════════════════════════════════
   STATE & HELPERS
════════════════════════════════════════ */
let allData = [];
let activeFilters = {};
let currentView = 'carte';
let sortCol = null;
let sortDir = 1;
let radiusFilter = null;   // { commune, lat, lng, km } when active
let radiusCircle = null;   // Leaflet circle layer
let countEls = {};         // { 'type_acteur:Trieur': <span>, ... } for dynamic counters
let suppressUrlSync = false;

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function actorDistance(a) {
  if (!radiusFilter || a.lat == null || a.lng == null) return null;
  return haversineKm(radiusFilter.lat, radiusFilter.lng, a.lat, a.lng);
}

function acteurInfo(typeActeur) {
  const key = Array.isArray(typeActeur) ? typeActeur[0] : typeActeur;
  return CONFIG.acteurConfig[key] || CONFIG.acteurConfig['default'];
}

/* ════════════════════════════════════════
   VIEW TOGGLE
════════════════════════════════════════ */
const listPanel  = document.getElementById('list-panel');
const tablePanel = document.getElementById('table-panel');

document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.view;
    if (view === currentView) return;
    currentView = view;

    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    listPanel.classList.remove('open');
    tablePanel.classList.remove('open');

    if (view === 'liste')   { listPanel.classList.add('open');  renderCards(); }
    if (view === 'tableau') { tablePanel.classList.add('open'); renderTable(); }
    if (view === 'carte')   { setTimeout(() => map.invalidateSize(), 50); }
    syncUrl();
  });
});

/* ════════════════════════════════════════
   MARKER ICONS — one badge per category
════════════════════════════════════════ */
const BADGE = 32; // px
const GAP   = 3;

function makeIcon(typeActeur) {
  const types = sortTypes(Array.isArray(typeActeur) ? typeActeur : [typeActeur]);
  const n = Math.max(types.length, 1);
  const width = n * BADGE + (n - 1) * GAP;
  const height = BADGE;

  const badges = types.map(t => {
    const info = CONFIG.acteurConfig[t] || CONFIG.acteurConfig['default'];
    return `<div class="mm-badge" style="background:${info.color}" title="${t}">${iconSvg(t)}</div>`;
  }).join('');

  return L.divIcon({
    className: '',
    html: `<div class="multi-marker"><div class="mm-row">${badges}</div></div>`,
    iconSize:    [width, height],
    iconAnchor:  [width / 2, height / 2],
    popupAnchor: [0, -height / 2 - 4]
  });
}

/* ════════════════════════════════════════
   POPUP
════════════════════════════════════════ */
function buildPopup(a) {
  const { color } = acteurInfo(a.type_acteur);
  const resBadges = (a.type_resine || []).map(r => `<span class="res-badge">${r}</span>`).join('');

  let rows = '';
  if (a.commune)     rows += `<div class="pop-row"><span>📍</span><span>${a.commune}${a.code_postal ? ' ' + a.code_postal : ''}</span></div>`;
  if (a.telephone)   rows += `<div class="pop-row"><span>📞</span><span>${a.telephone}</span></div>`;
  if (a.email)       rows += `<div class="pop-row"><span>✉️</span><a href="mailto:${a.email}">${a.email}</a></div>`;
  if (a.description) rows += `<div class="pop-row"><span>ℹ️</span><span>${a.description}</span></div>`;

  const types = sortTypes(Array.isArray(a.type_acteur) ? a.type_acteur : [a.type_acteur].filter(Boolean));
  const typeChips = types.map(t => {
    const info = CONFIG.acteurConfig[t] || CONFIG.acteurConfig['default'];
    return `<span class="pop-type-chip" style="background:${info.color}">
      <span class="ptc-ico">${iconSvg(t, { strokeWidth: 2.4 })}</span>${t}
    </span>`;
  }).join('');

  return `
    <div class="pop-header" style="--pop-color:${color}">
      <div class="pop-nom">${a.nom}</div>
      <div class="pop-types">${typeChips}</div>
    </div>
    <div class="pop-body">
      ${rows}
      ${resBadges ? `<div class="pop-resines">${resBadges}</div>` : ''}
      ${a.site_web ? `<a class="pop-link" href="${a.site_web}" target="_blank" rel="noopener">🔗 ${a.site_web}</a>` : ''}
    </div>`;
}

/* ════════════════════════════════════════
   FILTERS — CHECKBOX-BASED
════════════════════════════════════════ */
function uniqueValues(field, isArray) {
  const s = new Set();
  allData.forEach(a => {
    if (isArray && Array.isArray(a[field])) a[field].forEach(v => s.add(v));
    else if (a[field]) s.add(a[field]);
  });
  return [...s].sort();
}

function countValue(field, val, isArray) {
  return allData.filter(a => {
    if (isArray && Array.isArray(a[field])) return a[field].includes(val);
    return a[field] === val;
  }).length;
}

function buildFilters() {
  const container = document.getElementById('filters');
  container.innerHTML = '';
  countEls = {};

  CONFIG.filterFields.forEach(({ key, label, isArray }) => {
    const vals = uniqueValues(key, isArray);
    if (!vals.length) return;

    activeFilters[key] = new Set(vals);

    const section = document.createElement('div');
    section.className = 'filter-section';

    const hdr = document.createElement('div');
    hdr.className = 'section-hdr';
    const masterCb = document.createElement('input');
    masterCb.type = 'checkbox';
    masterCb.className = 'master-cb';
    masterCb.checked = true;
    masterCb.id = `master-${key}`;
    hdr.innerHTML = `<span class="section-hdr-title">${label}</span>`;
    hdr.appendChild(masterCb);
    section.appendChild(hdr);

    const optsList = document.createElement('div');
    optsList.className = 'filter-options';

    vals.forEach(val => {
      const isActeur = key === 'type_acteur';
      const info = isActeur ? (CONFIG.acteurConfig[val] || CONFIG.acteurConfig['default']) : null;
      const badgeColor = isActeur ? info.color : '#0e7490';
      const count      = countValue(key, val, isArray);

      const row = document.createElement('div');
      row.className = 'filter-row';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'filter-cb';
      cb.checked = true;
      cb.dataset.key = key;
      cb.dataset.val = val;
      cb.addEventListener('change', () => {
        if (cb.checked) activeFilters[key].add(val);
        else            activeFilters[key].delete(val);
        syncMasterCb(key);
        updateView();
      });

      const badge = document.createElement('span');
      badge.className = 'type-badge';
      badge.style.background = badgeColor;
      badge.innerHTML = isActeur ? iconSvg(val) : iconSvg('Autres');

      const name = document.createElement('span');
      name.className = 'filter-name';
      name.textContent = val;
      name.title = val;

      const countEl = document.createElement('span');
      countEl.className = 'filter-count';
      countEl.textContent = count;
      countEls[`${key}:${val}`] = countEl;

      const soloBtn = document.createElement('button');
      soloBtn.className = 'solo-btn';
      soloBtn.title = `Afficher uniquement "${val}"`;
      soloBtn.addEventListener('click', e => { e.stopPropagation(); soloFilter(key, val); });

      row.append(cb, badge, name, countEl, soloBtn);
      optsList.appendChild(row);
    });

    section.appendChild(optsList);
    container.appendChild(section);

    masterCb.addEventListener('change', () => {
      const checked = masterCb.checked;
      if (checked) activeFilters[key] = new Set(vals);
      else          activeFilters[key].clear();
      container.querySelectorAll(`.filter-cb[data-key="${key}"]`).forEach(c => {
        c.checked = checked;
        c.indeterminate = false;
      });
      updateView();
    });
  });
}

function syncMasterCb(key) {
  const master = document.getElementById(`master-${key}`);
  if (!master) return;
  const all      = [...document.querySelectorAll(`.filter-cb[data-key="${key}"]`)];
  const nChecked = all.filter(c => c.checked).length;
  if (nChecked === 0)             { master.checked = false; master.indeterminate = false; }
  else if (nChecked === all.length) { master.checked = true;  master.indeterminate = false; }
  else                             { master.checked = false; master.indeterminate = true; }
}

function soloFilter(key, val) {
  activeFilters[key] = new Set([val]);
  document.querySelectorAll(`.filter-cb[data-key="${key}"]`).forEach(c => {
    c.checked = c.dataset.val === val;
  });
  syncMasterCb(key);
  updateView();
}

/* ════════════════════════════════════════
   ACTIVE FILTER CHIPS (above map)
════════════════════════════════════════ */
function renderActiveChips() {
  const bar = document.getElementById('active-chips');
  bar.innerHTML = '';

  const searchVal = document.getElementById('search-input').value.trim();
  if (searchVal) {
    bar.appendChild(makeChip({
      cls: 'chip-search',
      label: `🔎 "${searchVal}"`,
      onRemove: () => {
        document.getElementById('search-input').value = '';
        updateView();
      }
    }));
  }

  CONFIG.filterFields.forEach(({ key, label, isArray }) => {
    const all = uniqueValues(key, isArray);
    const active = activeFilters[key] || new Set();
    const excluded = all.filter(v => !active.has(v));
    excluded.forEach(val => {
      const color = key === 'type_acteur'
        ? (CONFIG.acteurConfig[val] || CONFIG.acteurConfig.default).color
        : '#0e7490';
      bar.appendChild(makeChip({
        dot: color,
        label: `Sans : ${val}`,
        onRemove: () => {
          activeFilters[key].add(val);
          const cb = document.querySelector(`.filter-cb[data-key="${key}"][data-val="${cssEscape(val)}"]`);
          if (cb) cb.checked = true;
          syncMasterCb(key);
          updateView();
        }
      }));
    });
  });

  if (radiusFilter) {
    bar.appendChild(makeChip({
      cls: 'chip-radius',
      label: `📍 ≤ ${radiusFilter.km} km de ${radiusFilter.commune}`,
      onRemove: () => clearRadius()
    }));
  }
}

function makeChip({ cls = '', dot = null, label, onRemove }) {
  const el = document.createElement('div');
  el.className = 'filter-chip' + (cls ? ' ' + cls : '');
  if (dot) {
    const d = document.createElement('span');
    d.className = 'chip-dot';
    d.style.background = dot;
    el.appendChild(d);
  }
  const lab = document.createElement('span');
  lab.className = 'chip-label';
  lab.textContent = label;
  lab.title = label;
  el.appendChild(lab);
  const btn = document.createElement('button');
  btn.className = 'chip-x';
  btn.type = 'button';
  btn.textContent = '×';
  btn.title = 'Retirer';
  btn.addEventListener('click', onRemove);
  el.appendChild(btn);
  return el;
}

function cssEscape(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\]/g, '\\$&');
}

/* ════════════════════════════════════════
   COMMUNE DATALIST
════════════════════════════════════════ */
function buildCommuneList() {
  const dl = document.getElementById('commune-list');
  dl.innerHTML = '';
  const set = new Set();
  allData.forEach(a => { if (a.commune) set.add(a.commune); });
  [...set].sort((a, b) => a.localeCompare(b, 'fr')).forEach(c => {
    const o = document.createElement('option');
    o.value = c;
    dl.appendChild(o);
  });
}

/* ════════════════════════════════════════
   RESET
════════════════════════════════════════ */
document.getElementById('reset-btn').addEventListener('click', () => {
  CONFIG.filterFields.forEach(({ key, isArray }) => {
    const vals = uniqueValues(key, isArray);
    activeFilters[key] = new Set(vals);
    document.querySelectorAll(`.filter-cb[data-key="${key}"]`).forEach(c => {
      c.checked = true; c.indeterminate = false;
    });
    const m = document.getElementById(`master-${key}`);
    if (m) { m.checked = true; m.indeterminate = false; }
  });
  document.getElementById('search-input').value = '';
  clearRadius({ skipUpdate: true });
  updateView();
});

document.getElementById('search-input').addEventListener('input', updateView);

/* ════════════════════════════════════════
   GEOLOCATION
════════════════════════════════════════ */
document.getElementById('geo-btn').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(({ coords }) => {
    map.setView([coords.latitude, coords.longitude], 12);
  });
});

/* ════════════════════════════════════════
   SIDEBAR COLLAPSE
════════════════════════════════════════ */
const sidebar     = document.getElementById('sidebar');
const collapseBtn = document.getElementById('collapse-btn');
const expandBtn   = document.getElementById('expand-btn');

collapseBtn.addEventListener('click', () => {
  sidebar.classList.add('collapsed');
  expandBtn.classList.add('visible');
  setTimeout(() => map.invalidateSize(), 320);
});
expandBtn.addEventListener('click', () => {
  sidebar.classList.remove('collapsed');
  expandBtn.classList.remove('visible');
  setTimeout(() => map.invalidateSize(), 320);
});

/* ════════════════════════════════════════
   FILTER
════════════════════════════════════════ */
function getFiltered(opts = {}) {
  const skipKey = opts.skipKey || null;
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  return allData.filter(a => {
    if (q) {
      const hay = [
        a.nom, a.commune, a.adresse, a.description,
        ...(Array.isArray(a.type_acteur) ? a.type_acteur : [a.type_acteur]),
        ...(Array.isArray(a.type_resine) ? a.type_resine : [a.type_resine])
      ].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    for (const { key, isArray } of CONFIG.filterFields) {
      if (key === skipKey) continue;
      const active = activeFilters[key];
      if (!active || active.size === 0) return false;
      if (isArray) {
        if (!(a[key] || []).some(v => active.has(v))) return false;
      } else {
        if (!active.has(a[key])) return false;
      }
    }
    if (radiusFilter) {
      if (a.lat == null || a.lng == null) return false;
      if (haversineKm(radiusFilter.lat, radiusFilter.lng, a.lat, a.lng) > radiusFilter.km) return false;
    }
    return true;
  });
}

function dynamicCount(key, val, isArray) {
  const base = getFiltered({ skipKey: key });
  if (isArray) return base.filter(a => (a[key] || []).includes(val)).length;
  return base.filter(a => a[key] === val).length;
}

function refreshCounts() {
  CONFIG.filterFields.forEach(({ key, isArray }) => {
    const vals = uniqueValues(key, isArray);
    vals.forEach(val => {
      const el = countEls[`${key}:${val}`];
      if (el) el.textContent = dynamicCount(key, val, isArray);
    });
  });
}

/* ════════════════════════════════════════
   RENDER: MAP
════════════════════════════════════════ */
function renderMap(filtered) {
  clusterGroup.clearLayers();
  filtered.forEach(a => {
    if (a.lat == null || a.lng == null) return;
    const marker = L.marker([a.lat, a.lng], { icon: makeIcon(a.type_acteur) });
    marker.bindPopup(buildPopup(a), { className: 'custom-popup', maxWidth: 300 });
    if (a.nom) {
      marker.bindTooltip(a.nom, {
        className: 'mm-name-tip',
        direction: 'top',
        offset: [0, -18],
        opacity: 1
      });
    }
    clusterGroup.addLayer(marker);
  });
}

/* ════════════════════════════════════════
   RENDER: CARDS
════════════════════════════════════════ */
function renderCards() {
  const filtered = getFiltered();
  document.getElementById('list-hdr').innerHTML =
    `<strong>${filtered.length}</strong> acteur${filtered.length > 1 ? 's' : ''}`;
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';
  filtered.forEach(a => {
    const { color } = acteurInfo(a.type_acteur);
    const types = Array.isArray(a.type_acteur) ? a.type_acteur.join(', ') : (a.type_acteur || '—');
    const card = document.createElement('div');
    card.className = 'actor-card';
    card.style.borderLeftColor = color;
    card.innerHTML = `
      <div class="card-nom">${a.nom}</div>
      <div class="card-type">${types}</div>
      ${a.commune ? `<div class="card-info"><span>📍</span>${a.commune}${a.code_postal ? ' ' + a.code_postal : ''}</div>` : ''}
      ${a.telephone ? `<div class="card-info"><span>📞</span>${a.telephone}</div>` : ''}
      ${(a.type_resine || []).length ? `
        <div class="card-resines">
          ${(a.type_resine).map(r => `<span class="card-res-badge">${r}</span>`).join('')}
        </div>` : ''}`;
    grid.appendChild(card);
  });
}

/* ════════════════════════════════════════
   RENDER: TABLE (with sort)
════════════════════════════════════════ */
function getSortedFiltered() {
  let filtered = getFiltered();
  const col = sortCol || (radiusFilter ? 'distance' : null);
  if (col) {
    const dir = sortCol ? sortDir : 1;
    filtered = [...filtered].sort((a, b) => {
      const va = colVal(a, col);
      const vb = colVal(b, col);
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'fr', { sensitivity: 'base' }) * dir;
    });
  }
  return filtered;
}

function renderTable() {
  const filtered = getSortedFiltered();
  document.getElementById('table-count').innerHTML =
    `<strong>${filtered.length}</strong> acteur${filtered.length > 1 ? 's' : ''}`;

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  filtered.forEach(a => {
    const types = Array.isArray(a.type_acteur) ? a.type_acteur : [a.type_acteur || ''];
    const typesHtml = types.map(t => {
      const { color } = CONFIG.acteurConfig[t] || CONFIG.acteurConfig['default'];
      return `<span class="lt-dot" style="background:${color}"></span>${t}`;
    }).join(', ');
    const dist = actorDistance(a);
    const distCell = dist != null ? `${dist.toFixed(1)} km` : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${a.nom}</strong></td>
      <td>${typesHtml}</td>
      <td>${a.commune || a.adresse || '—'}</td>
      <td>${(a.type_resine || []).join(', ') || '—'}</td>
      <td class="col-distance">${distCell}</td>`;
    tbody.appendChild(tr);
  });
}

function colVal(a, col) {
  if (col === 'nom')          return a.nom || '';
  if (col === 'type_acteur')  return (Array.isArray(a.type_acteur) ? a.type_acteur[0] : a.type_acteur) || '';
  if (col === 'commune')      return a.commune || a.adresse || '';
  if (col === 'type_resine')  return (a.type_resine || []).join(',');
  if (col === 'distance') {
    const d = actorDistance(a);
    return d == null ? Infinity : d;
  }
  return '';
}

/* Table column sort */
document.querySelectorAll('#data-table th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortDir *= -1;
    } else {
      sortCol = col;
      sortDir = 1;
    }
    document.querySelectorAll('#data-table th').forEach(h => {
      h.classList.remove('sort-asc', 'sort-desc');
      h.querySelector('.sort-icon').textContent = '↕';
    });
    th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    th.querySelector('.sort-icon').textContent = sortDir === 1 ? '↑' : '↓';
    renderTable();
    syncUrl();
  });
});

/* ════════════════════════════════════════
   UPDATE ALL VIEWS
════════════════════════════════════════ */
function updateView() {
  const filtered = getFiltered();
  const n = filtered.length;
  document.getElementById('results-count').innerHTML =
    `<strong>${n}</strong> acteur${n > 1 ? 's' : ''} affiché${n > 1 ? 's' : ''} sur ${allData.length}`;

  renderMap(filtered);
  renderActiveChips();
  refreshCounts();
  if (currentView === 'liste')   renderCards();
  if (currentView === 'tableau') renderTable();
  syncUrl();
}

/* ════════════════════════════════════════
   RADIUS FILTER (proximity)
════════════════════════════════════════ */
function findLocalCommune(name) {
  const target = name.trim().toLowerCase();
  if (!target) return null;
  const hit = allData.find(a => a.commune && a.commune.toLowerCase() === target
                                  && a.lat != null && a.lng != null);
  if (hit) return { commune: hit.commune, lat: hit.lat, lng: hit.lng };
  return null;
}

async function geocodeCommune(name) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name + ', France')}&format=json&limit=1&countrycodes=fr`;
  const res = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const arr = await res.json();
  if (!arr.length) throw new Error('Commune introuvable');
  return {
    commune: name,
    lat: parseFloat(arr[0].lat),
    lng: parseFloat(arr[0].lon)
  };
}

function drawRadiusCircle(recenter = true) {
  if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
  if (!radiusFilter) return;
  radiusCircle = L.circle([radiusFilter.lat, radiusFilter.lng], {
    radius: radiusFilter.km * 1000,
    color: '#1976d2',
    weight: 2,
    fillColor: '#1976d2',
    fillOpacity: 0.07,
    interactive: false
  }).addTo(map);
  if (recenter) {
    map.fitBounds(radiusCircle.getBounds(), { padding: [40, 40], maxZoom: 12 });
  }
}

async function setRadius(commune, km, opts = {}) {
  const status = document.getElementById('prox-status');
  status.className = '';
  status.textContent = '';
  if (!commune) return;
  let resolved = findLocalCommune(commune);
  if (!resolved) {
    status.textContent = 'Recherche…';
    try {
      resolved = await geocodeCommune(commune);
    } catch (e) {
      status.className = 'error';
      status.textContent = 'Commune introuvable';
      return;
    }
  }
  radiusFilter = { commune: resolved.commune, lat: resolved.lat, lng: resolved.lng, km };
  document.body.classList.add('has-radius');
  document.getElementById('prox-clear').style.display = '';
  status.className = 'ok';
  status.textContent = `📍 ${resolved.commune}`;
  drawRadiusCircle(opts.recenter !== false);
  updateView();
}

function clearRadius(opts = {}) {
  radiusFilter = null;
  if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
  document.body.classList.remove('has-radius');
  document.getElementById('prox-input').value = '';
  document.getElementById('prox-clear').style.display = 'none';
  const status = document.getElementById('prox-status');
  status.className = '';
  status.textContent = '';
  if (!opts.skipUpdate) updateView();
}

document.getElementById('prox-apply').addEventListener('click', () => {
  const v = document.getElementById('prox-input').value.trim();
  const km = parseInt(document.getElementById('prox-radius').value, 10);
  if (v) setRadius(v, km);
});
document.getElementById('prox-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('prox-apply').click();
  }
});
document.getElementById('prox-clear').addEventListener('click', () => clearRadius());

const radiusSlider = document.getElementById('prox-radius');
const radiusLabel  = document.getElementById('prox-radius-val');
radiusSlider.addEventListener('input', () => {
  radiusLabel.textContent = radiusSlider.value + ' km';
});
radiusSlider.addEventListener('change', () => {
  if (radiusFilter) {
    radiusFilter.km = parseInt(radiusSlider.value, 10);
    drawRadiusCircle(false);
    updateView();
  }
});

/* ════════════════════════════════════════
   CSV EXPORT
════════════════════════════════════════ */
function csvCell(v) {
  if (v == null) return '';
  const s = String(v);
  if (/[",;\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCsv() {
  const rows = getSortedFiltered();
  const hasRadius = !!radiusFilter;
  const headers = ['Nom', "Type d'acteur", 'Commune', 'Code postal', 'Adresse', 'Résines', 'Téléphone', 'Email', 'Site web', 'Latitude', 'Longitude'];
  if (hasRadius) headers.push('Distance (km)');
  const lines = [headers.map(csvCell).join(';')];
  rows.forEach(a => {
    const cells = [
      a.nom,
      (a.type_acteur || []).join(', '),
      a.commune || '',
      a.code_postal || '',
      a.adresse || '',
      (a.type_resine || []).join(', '),
      a.telephone || '',
      a.email || '',
      a.site_web || '',
      a.lat != null ? a.lat : '',
      a.lng != null ? a.lng : ''
    ];
    if (hasRadius) {
      const d = actorDistance(a);
      cells.push(d != null ? d.toFixed(2) : '');
    }
    lines.push(cells.map(csvCell).join(';'));
  });
  const csv = '﻿' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const date = new Date().toISOString().slice(0, 10);
  a.download = `acteurs-plastiques-${date}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById('csv-export-btn').addEventListener('click', exportCsv);

/* ════════════════════════════════════════
   URL SYNC (shareable state)
════════════════════════════════════════ */
function syncUrl() {
  if (suppressUrlSync) return;
  const params = new URLSearchParams();
  const q = document.getElementById('search-input').value.trim();
  if (q) params.set('q', q);
  CONFIG.filterFields.forEach(({ key, isArray }) => {
    const all = uniqueValues(key, isArray);
    const active = activeFilters[key] || new Set();
    if (active.size !== all.length) {
      const short = key === 'type_acteur' ? 'types' : key === 'type_resine' ? 'resines' : key;
      params.set(short, [...active].join(','));
    }
  });
  if (currentView !== 'carte') params.set('view', currentView);
  if (radiusFilter) {
    params.set('commune', radiusFilter.commune);
    params.set('radius', String(radiusFilter.km));
  }
  if (sortCol) params.set('sort', `${sortCol}:${sortDir === 1 ? 'asc' : 'desc'}`);
  const qs = params.toString();
  const newUrl = location.pathname + (qs ? '?' + qs : '');
  history.replaceState(null, '', newUrl);
}

function applyUrlState() {
  const params = new URLSearchParams(location.search);
  suppressUrlSync = true;

  const q = params.get('q');
  if (q) document.getElementById('search-input').value = q;

  const keyMap = { types: 'type_acteur', resines: 'type_resine' };
  Object.entries(keyMap).forEach(([short, key]) => {
    if (!params.has(short)) return;
    const wanted = new Set(params.get(short).split(',').filter(Boolean));
    document.querySelectorAll(`.filter-cb[data-key="${key}"]`).forEach(cb => {
      cb.checked = wanted.has(cb.dataset.val);
    });
    activeFilters[key] = new Set(
      [...document.querySelectorAll(`.filter-cb[data-key="${key}"]`)]
        .filter(cb => cb.checked).map(cb => cb.dataset.val)
    );
    syncMasterCb(key);
  });

  const view = params.get('view');
  if (view && ['carte', 'liste', 'tableau'].includes(view)) {
    const btn = document.querySelector(`.view-btn[data-view="${view}"]`);
    if (btn && view !== currentView) btn.click();
  }

  const sortP = params.get('sort');
  if (sortP) {
    const [col, dir] = sortP.split(':');
    sortCol = col;
    sortDir = dir === 'desc' ? -1 : 1;
    document.querySelectorAll('#data-table th').forEach(h => {
      h.classList.remove('sort-asc', 'sort-desc');
      h.querySelector('.sort-icon').textContent = '↕';
    });
    const th = document.querySelector(`#data-table th[data-col="${col}"]`);
    if (th) {
      th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
      th.querySelector('.sort-icon').textContent = sortDir === 1 ? '↑' : '↓';
    }
  }

  const commune = params.get('commune');
  const radius = params.get('radius');
  suppressUrlSync = false;

  if (commune && radius) {
    const km = parseInt(radius, 10);
    document.getElementById('prox-input').value = commune;
    document.getElementById('prox-radius').value = String(km);
    document.getElementById('prox-radius-val').textContent = km + ' km';
    setRadius(commune, km, { recenter: true });
  }
}

/* ════════════════════════════════════════
   LEGEND
════════════════════════════════════════ */
function buildLegend() {
  const body = document.getElementById('legend-body');
  body.innerHTML = ACTEUR_ORDER
    .filter(t => CONFIG.acteurConfig[t])
    .map(t => {
      const info = CONFIG.acteurConfig[t];
      return `<div class="leg-row">
        <span class="leg-badge" style="background:${info.color}">${iconSvg(t)}</span>
        <span class="leg-label">${info.label}</span>
      </div>`;
    }).join('');
}
document.getElementById('legend-hdr').addEventListener('click', () => {
  document.getElementById('legend').classList.toggle('collapsed');
});

/* ════════════════════════════════════════
   DATA LOADING
════════════════════════════════════════ */
fetch(CONFIG.dataUrl)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => {
    allData = data;
    buildFilters();
    buildCommuneList();
    buildLegend();
    applyUrlState();
    updateView();
  })
  .catch(err => {
    console.error('Erreur chargement JSON:', err);
    document.getElementById('results-count').innerHTML =
      '<span style="color:#ef4444">Impossible de charger data/acteurs.json</span>';
  });
</script>
