<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acteurs plastiques</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --sidebar-w: 230px;
      --navbar-h:  50px;
      --green:     #4caf50;
      --green-d:   #388e3c;
      --blue:      #1976d2;
      --text:      #333;
      --muted:     #777;
      --border:    #e0e0e0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── NAVBAR ── */
    #navbar {
      height: var(--navbar-h);
      background: #1e2d4d;
      display: flex;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      z-index: 3000;
    }
    #nav-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      margin-right: auto;
    }
    .nav-link {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 4px;
      margin-right: 6px;
      transition: color .2s;
    }
    .nav-link:hover, .nav-link.active { color: #fff; }
    #btn-add {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-right: 12px;
      transition: background .2s;
      white-space: nowrap;
    }
    #btn-add:hover { background: var(--green-d); }
    #user-menu {
      color: var(--green);
      background: none;
      border: none;
      font-size: 0.84rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    /* ── MAIN ── */
    #main { flex: 1; display: flex; overflow: hidden; }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100%;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .3s, min-width .3s;
      position: relative;
      z-index: 1000;
    }
    #sidebar.collapsed { width: 0; min-width: 0; }

    /* Search */
    #search-wrap {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #search-input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      background: #f8f8f8;
      color: var(--text);
      transition: border-color .2s;
      min-width: 0;
    }
    #search-input:focus { border-color: var(--blue); background: #fff; }
    #search-input::placeholder { color: #aaa; }
    #geo-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--blue);
      padding: 3px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    #collapse-btn {
      background: #fff;
      border: 1px solid var(--border);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.58rem;
      color: #999;
      flex-shrink: 0;
      transition: border-color .2s, color .2s;
    }
    #collapse-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* Filters */
    #filters { flex: 1; overflow-y: auto; scrollbar-width: thin; }

    .filter-section { border-bottom: 1px solid var(--border); }

    .section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: #f7f7f7;
      border-bottom: 1px solid var(--border);
    }
    .section-hdr-title {
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #555;
    }
    .master-cb {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: var(--green);
    }

    .filter-row {
      display: flex;
      align-items: center;
      padding: 5px 12px;
      gap: 7px;
      transition: background .1s;
    }
    .filter-row:hover { background: #f5f5f5; }

    .filter-cb {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--green);
      flex-shrink: 0;
    }
    .type-badge {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .filter-name {
      flex: 1;
      font-size: 0.79rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .filter-count {
      font-size: 0.72rem;
      color: #999;
      flex-shrink: 0;
      min-width: 16px;
      text-align: right;
    }
    .solo-btn {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: border-color .2s;
    }
    .solo-btn:hover { border-color: var(--blue); background: #e3f2fd; }

    /* Footer */
    #sidebar-foot {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: #fafafa;
      flex-shrink: 0;
    }
    #results-count { font-size: .74rem; color: #666; margin-bottom: 6px; }
    #results-count strong { color: var(--text); font-weight: 600; }
    #reset-btn {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px;
      font-size: .72rem;
      font-family: inherit;
      color: #666;
      cursor: pointer;
      transition: all .2s;
    }
    #reset-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* ── MAP AREA ── */
    #map-container { flex: 1; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    #list-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 500;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: .79rem;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
      transition: box-shadow .2s;
    }
    #list-btn:hover { box-shadow: 0 3px 10px rgba(0,0,0,.2); }

    #expand-btn {
      display: none;
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 600;
      width: 20px;
      height: 48px;
      background: #fff;
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: .6rem;
      color: #999;
      box-shadow: 2px 0 6px rgba(0,0,0,.1);
    }
    #expand-btn.visible { display: flex; }

    /* ── LIST PANEL ── */
    #list-panel {
      display: none;
      position: absolute;
      inset: 0;
      background: #fff;
      z-index: 400;
      overflow-y: auto;
      padding: 16px;
    }
    #list-panel.open { display: block; }
    #list-panel-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    #list-panel-hdr h2 { font-size: 1rem; font-weight: 600; color: var(--text); }
    #close-list {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: .8rem;
      font-family: inherit;
      cursor: pointer;
      color: var(--muted);
    }
    #close-list:hover { border-color: var(--blue); color: var(--blue); }
    #list-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
    }
    #list-table th {
      background: #f5f5f5;
      text-align: left;
      padding: 8px 10px;
      border-bottom: 2px solid var(--border);
      font-weight: 600;
      color: #555;
    }
    #list-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    #list-table tr:hover td { background: #f9f9f9; }
    .lt-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ── POPUP ── */
    .custom-popup .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      padding: 0;
      overflow: hidden;
    }
    .custom-popup .leaflet-popup-content { margin: 0; width: 260px !important; }
    .custom-popup .leaflet-popup-tip { background: #fff; }
    .pop-header { padding: 11px 13px 9px; border-left: 4px solid var(--pop-color, #1976d2); }
    .pop-nom { font-weight: 600; font-size: .92rem; color: #1e293b; }
    .pop-type { font-size: .71rem; color: #64748b; margin-top: 2px; }
    .pop-body { padding: 8px 13px 12px; border-top: 1px solid #e2e8f0; }
    .pop-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 5px; font-size: .77rem; color: #64748b; }
    .pop-resines { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .res-badge {
      font-size: .67rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #64748b;
      text-transform: uppercase;
    }
    .pop-link { display: inline-block; margin-top: 8px; font-size: .74rem; color: #1976d2; text-decoration: none; word-break: break-all; }
    .pop-link:hover { text-decoration: underline; }

    /* ── MOBILE ── */
    #toggle-btn {
      display: none;
      position: fixed;
      bottom: 18px;
      left: 18px;
      z-index: 4000;
      background: #1e2d4d;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0; top: var(--navbar-h);
        height: calc(100vh - var(--navbar-h));
        transform: translateX(-100%);
        width: var(--sidebar-w) !important;
        min-width: var(--sidebar-w) !important;
      }
      #sidebar.open { transform: translateX(0); }
      #toggle-btn { display: flex; }
      #collapse-btn, #expand-btn { display: none !important; }
    }
  </style>
</head>
<body>

<!-- ═══ NAVBAR ═══ -->
<nav id="navbar">
  <div id="nav-title">Acteurs plastiques</div>
  <a href="#" class="nav-link active">La carte</a>
  <button id="btn-add">+ Ajouter un élément</button>
  <button id="user-menu">A.FARCY ▾</button>
</nav>

<!-- ═══ MAIN ═══ -->
<div id="main">

  <!-- SIDEBAR -->
  <aside id="sidebar">

    <div id="search-wrap">
      <input type="text" id="search-input" placeholder="Chercher">
      <button id="geo-btn" title="Ma position">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </button>
      <button id="collapse-btn" title="Réduire le panneau">◀</button>
    </div>

    <div id="filters"><!-- généré dynamiquement --></div>

    <div id="sidebar-foot">
      <div id="results-count">…</div>
      <button id="reset-btn">↺ Réinitialiser les filtres</button>
    </div>
  </aside>

  <!-- MAP -->
  <div id="map-container">

    <button id="list-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/>
        <circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
      Afficher sous forme de liste
    </button>

    <button id="expand-btn" title="Afficher le panneau">▶</button>

    <!-- List panel (overlay on map) -->
    <div id="list-panel">
      <div id="list-panel-hdr">
        <h2 id="list-title">Liste des acteurs</h2>
        <button id="close-list">✕ Retour à la carte</button>
      </div>
      <table id="list-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Type d'acteur</th>
            <th>Commune</th>
            <th>Résines</th>
          </tr>
        </thead>
        <tbody id="list-body"></tbody>
      </table>
    </div>

    <div id="map"></div>
  </div>
</div>

<button id="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<script>
/* ════════════════════════════════════════
   CONFIG
════════════════════════════════════════ */
const CONFIG = {
  dataUrl: 'data/acteurs.json',
  mapCenter: [49.1, 0.3],
  mapZoom: 8,
  filterFields: [
    { key: 'type_acteur', label: "TYPE D'ACTEUR",           isArray: true },
    { key: 'type_resine', label: 'TYPE DE RÉSINE GÉRÉE(S)', isArray: true }
  ],
  acteurConfig: {
    'Trieur':       { color: '#b45309', bg: '#fef3c7', symbol: '↕',  label: 'Trieur' },
    'Broyeur':      { color: '#166534', bg: '#dcfce7', symbol: '⚙',  label: 'Broyeur' },
    'Recycleur':    { color: '#15803d', bg: '#d1fae5', symbol: '♻',  label: 'Recycleur' },
    'Négociant':    { color: '#92400e', bg: '#fef9c3', symbol: '€',  label: 'Négociant' },
    'Plasturgiste': { color: '#1e40af', bg: '#dbeafe', symbol: '◆',  label: 'Plasturgiste' },
    'Collecteur':   { color: '#155e75', bg: '#cffafe', symbol: '🚚', label: 'Collecteur' },
    'Autres':       { color: '#4b5563', bg: '#f3f4f6', symbol: '●',  label: 'Autres' },
    'default':      { color: '#4b5563', bg: '#f3f4f6', symbol: '●',  label: '?' }
  }
};

/* ════════════════════════════════════════
   MAP INIT
════════════════════════════════════════ */
const map = L.map('map').setView(CONFIG.mapCenter, CONFIG.mapZoom);

L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> France',
  maxZoom: 20
}).addTo(map);

const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 60 });
map.addLayer(clusterGroup);

/* ════════════════════════════════════════
   STATE & HELPERS
════════════════════════════════════════ */
let allData = [];
let activeFilters = {};

function acteurInfo(typeActeur) {
  const key = Array.isArray(typeActeur) ? typeActeur[0] : typeActeur;
  return CONFIG.acteurConfig[key] || CONFIG.acteurConfig['default'];
}

/* ════════════════════════════════════════
   MARKER ICONS  (pin shape + symbol)
════════════════════════════════════════ */
function makeIcon(typeActeur) {
  const { color, symbol } = acteurInfo(typeActeur);
  const safeSymbol = symbol.codePointAt(0) > 0xFFFF ? symbol : symbol;
  return L.divIcon({
    className: '',
    html: `<div style="position:relative;width:28px;height:38px;">
      <svg width="28" height="38" viewBox="0 0 28 38" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;">
        <path d="M14 0C6.27 0 0 6.27 0 14c0 9.9 14 24 14 24S28 23.9 28 14C28 6.27 21.73 0 14 0z"
              fill="${color}" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
        <circle cx="14" cy="13" r="7" fill="rgba(255,255,255,0.22)"/>
      </svg>
      <div style="position:absolute;top:4px;left:0;width:28px;text-align:center;
                  color:#fff;font-size:12px;line-height:1;font-family:sans-serif;">${safeSymbol}</div>
    </div>`,
    iconSize:    [28, 38],
    iconAnchor:  [14, 38],
    popupAnchor: [0, -40]
  });
}

/* ════════════════════════════════════════
   POPUP
════════════════════════════════════════ */
function buildPopup(a) {
  const { color } = acteurInfo(a.type_acteur);
  const badges = (a.type_resine || []).map(r => `<span class="res-badge">${r}</span>`).join('');

  let rows = '';
  if (a.commune)     rows += `<div class="pop-row"><span>📍</span><span>${a.commune}${a.code_postal ? ' ' + a.code_postal : ''}</span></div>`;
  if (a.telephone)   rows += `<div class="pop-row"><span>📞</span><span>${a.telephone}</span></div>`;
  if (a.email)       rows += `<div class="pop-row"><span>✉️</span><a href="mailto:${a.email}">${a.email}</a></div>`;
  if (a.description) rows += `<div class="pop-row"><span>ℹ️</span><span>${a.description}</span></div>`;

  const types = Array.isArray(a.type_acteur) ? a.type_acteur.join(', ') : (a.type_acteur || '');
  return `
    <div class="pop-header" style="--pop-color:${color}">
      <div class="pop-nom">${a.nom}</div>
      <div class="pop-type">${types}</div>
    </div>
    <div class="pop-body">
      ${rows}
      ${badges ? `<div class="pop-resines">${badges}</div>` : ''}
      ${a.site_web ? `<a class="pop-link" href="${a.site_web}" target="_blank" rel="noopener">🔗 ${a.site_web}</a>` : ''}
    </div>`;
}

/* ════════════════════════════════════════
   FILTERS — CHECKBOX-BASED
════════════════════════════════════════ */
function uniqueValues(field, isArray) {
  const s = new Set();
  allData.forEach(a => {
    if (isArray && Array.isArray(a[field])) a[field].forEach(v => s.add(v));
    else if (a[field]) s.add(a[field]);
  });
  return [...s].sort();
}

function countValue(field, val, isArray) {
  return allData.filter(a => {
    if (isArray && Array.isArray(a[field])) return a[field].includes(val);
    return a[field] === val;
  }).length;
}

function buildFilters() {
  const container = document.getElementById('filters');
  container.innerHTML = '';

  CONFIG.filterFields.forEach(({ key, label, isArray }) => {
    const vals = uniqueValues(key, isArray);
    if (!vals.length) return;

    activeFilters[key] = new Set(vals);

    const section = document.createElement('div');
    section.className = 'filter-section';

    // Section header
    const hdr = document.createElement('div');
    hdr.className = 'section-hdr';
    const masterCb = document.createElement('input');
    masterCb.type = 'checkbox';
    masterCb.className = 'master-cb';
    masterCb.checked = true;
    masterCb.id = `master-${key}`;
    hdr.innerHTML = `<span class="section-hdr-title">${label}</span>`;
    hdr.appendChild(masterCb);
    section.appendChild(hdr);

    const optsList = document.createElement('div');
    optsList.className = 'filter-options';

    vals.forEach(val => {
      const isActeur = key === 'type_acteur';
      const info = isActeur ? (CONFIG.acteurConfig[val] || CONFIG.acteurConfig['default']) : null;
      const badgeColor = isActeur ? info.color : '#0e7490';
      const badgeBg    = isActeur ? info.bg    : '#cffafe';
      const symbol     = isActeur ? info.symbol : '●';
      const count      = countValue(key, val, isArray);

      const row = document.createElement('div');
      row.className = 'filter-row';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'filter-cb';
      cb.checked = true;
      cb.dataset.key = key;
      cb.dataset.val = val;
      cb.addEventListener('change', () => {
        if (cb.checked) activeFilters[key].add(val);
        else            activeFilters[key].delete(val);
        syncMasterCb(key);
        updateMap();
      });

      const badge = document.createElement('span');
      badge.className = 'type-badge';
      badge.style.cssText = `background:${badgeBg};color:${badgeColor};`;
      badge.textContent = symbol;

      const name = document.createElement('span');
      name.className = 'filter-name';
      name.textContent = val;
      name.title = val;

      const countEl = document.createElement('span');
      countEl.className = 'filter-count';
      countEl.textContent = count;

      const soloBtn = document.createElement('button');
      soloBtn.className = 'solo-btn';
      soloBtn.title = `Afficher uniquement "${val}"`;
      soloBtn.addEventListener('click', e => { e.stopPropagation(); soloFilter(key, val); });

      row.append(cb, badge, name, countEl, soloBtn);
      optsList.appendChild(row);
    });

    section.appendChild(optsList);
    container.appendChild(section);

    masterCb.addEventListener('change', () => {
      const checked = masterCb.checked;
      if (checked) activeFilters[key] = new Set(vals);
      else          activeFilters[key].clear();
      container.querySelectorAll(`.filter-cb[data-key="${key}"]`).forEach(c => {
        c.checked = checked;
        c.indeterminate = false;
      });
      updateMap();
    });
  });
}

function syncMasterCb(key) {
  const master = document.getElementById(`master-${key}`);
  if (!master) return;
  const all     = [...document.querySelectorAll(`.filter-cb[data-key="${key}"]`)];
  const nChecked = all.filter(c => c.checked).length;
  if (nChecked === 0)          { master.checked = false; master.indeterminate = false; }
  else if (nChecked === all.length) { master.checked = true;  master.indeterminate = false; }
  else                          { master.checked = false; master.indeterminate = true; }
}

function soloFilter(key, val) {
  activeFilters[key] = new Set([val]);
  document.querySelectorAll(`.filter-cb[data-key="${key}"]`).forEach(c => {
    c.checked = c.dataset.val === val;
  });
  syncMasterCb(key);
  updateMap();
}

/* ════════════════════════════════════════
   RESET
════════════════════════════════════════ */
document.getElementById('reset-btn').addEventListener('click', () => {
  CONFIG.filterFields.forEach(({ key, isArray }) => {
    const vals = uniqueValues(key, isArray);
    activeFilters[key] = new Set(vals);
    document.querySelectorAll(`.filter-cb[data-key="${key}"]`).forEach(c => {
      c.checked = true; c.indeterminate = false;
    });
    const m = document.getElementById(`master-${key}`);
    if (m) { m.checked = true; m.indeterminate = false; }
  });
  document.getElementById('search-input').value = '';
  updateMap();
});

document.getElementById('search-input').addEventListener('input', updateMap);

/* ════════════════════════════════════════
   GEOLOCATION
════════════════════════════════════════ */
document.getElementById('geo-btn').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(({ coords }) => {
    map.setView([coords.latitude, coords.longitude], 12);
  });
});

/* ════════════════════════════════════════
   SIDEBAR COLLAPSE
════════════════════════════════════════ */
const sidebar    = document.getElementById('sidebar');
const collapseBtn = document.getElementById('collapse-btn');
const expandBtn   = document.getElementById('expand-btn');

collapseBtn.addEventListener('click', () => {
  sidebar.classList.add('collapsed');
  expandBtn.classList.add('visible');
  setTimeout(() => map.invalidateSize(), 320);
});
expandBtn.addEventListener('click', () => {
  sidebar.classList.remove('collapsed');
  expandBtn.classList.remove('visible');
  setTimeout(() => map.invalidateSize(), 320);
});

/* ════════════════════════════════════════
   LIST VIEW
════════════════════════════════════════ */
const listPanel = document.getElementById('list-panel');
const listBtn   = document.getElementById('list-btn');

listBtn.addEventListener('click', () => {
  listPanel.classList.add('open');
  listBtn.style.display = 'none';
  renderList();
});
document.getElementById('close-list').addEventListener('click', () => {
  listPanel.classList.remove('open');
  listBtn.style.display = '';
});

function renderList() {
  const filtered = getFiltered();
  document.getElementById('list-title').textContent = `Liste des acteurs (${filtered.length})`;
  const tbody = document.getElementById('list-body');
  tbody.innerHTML = '';
  filtered.forEach(a => {
    const types = Array.isArray(a.type_acteur) ? a.type_acteur : [a.type_acteur || ''];
    const typesHtml = types.map(t => {
      const { color } = CONFIG.acteurConfig[t] || CONFIG.acteurConfig['default'];
      return `<span class="lt-dot" style="background:${color}"></span>${t}`;
    }).join(', ');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${a.nom}</strong></td>
      <td>${typesHtml}</td>
      <td>${a.commune || a.adresse || '—'}</td>
      <td>${(a.type_resine || []).join(', ') || '—'}</td>`;
    tbody.appendChild(tr);
  });
}

/* ════════════════════════════════════════
   MAP UPDATE
════════════════════════════════════════ */
function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase();
  return allData.filter(a => {
    if (q) {
      const hay = [a.nom, a.commune, a.adresse, a.description]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    for (const { key, isArray } of CONFIG.filterFields) {
      const active = activeFilters[key];
      if (!active || active.size === 0) return false;
      if (isArray) {
        if (!(a[key] || []).some(v => active.has(v))) return false;
      } else {
        if (!active.has(a[key])) return false;
      }
    }
    return true;
  });
}

function updateMap() {
  clusterGroup.clearLayers();
  const filtered = getFiltered();
  filtered.forEach(a => {
    if (a.lat == null || a.lng == null) return;
    const marker = L.marker([a.lat, a.lng], { icon: makeIcon(a.type_acteur) });
    marker.bindPopup(buildPopup(a), { className: 'custom-popup', maxWidth: 280 });
    clusterGroup.addLayer(marker);
  });
  const n = filtered.length;
  document.getElementById('results-count').innerHTML =
    `<strong>${n}</strong> acteur${n > 1 ? 's' : ''} affiché${n > 1 ? 's' : ''} sur ${allData.length}`;
  if (listPanel.classList.contains('open')) renderList();
}

/* ════════════════════════════════════════
   DATA LOADING
════════════════════════════════════════ */
fetch(CONFIG.dataUrl)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => {
    allData = data;
    buildFilters();
    updateMap();
  })
  .catch(err => {
    console.error('Erreur chargement JSON:', err);
    document.getElementById('results-count').innerHTML =
      '<span style="color:#ef4444">Impossible de charger data/acteurs.json</span>';
  });
</script>
