<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acteurs plastiques</title>

  <!-- Polices (avant la CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

  <!-- Thème Atelier (après Leaflet) -->
  <link rel="stylesheet" href="acteurs-atelier.css"/>

  <!-- Icônes (dispo globalement via window.ICONS) -->
  <script src="icons.js"></script>

  <style>
    /* ── Glue CSS : éléments non couverts par acteurs-atelier.css ── */

    /* Panneaux overlay (liste / tableau) */
    .view-panel      { display: none; }
    .view-panel.open { display: flex; }

    /* Colonne distance cachée par défaut, visible si filtre rayon actif */
    .col-distance                { display: none; }
    body.has-radius .col-distance { display: table-cell; }

    /* Chips filtres actifs flottant sur la carte */
    #active-chips { display: none; }
    .filter-chip {
      pointer-events: auto; display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 6px 4px 10px; background: var(--panel);
      border: 1px solid var(--line); border-radius: var(--radius-pill);
      font-family: var(--font-body); font-size: .78rem; font-weight: 500;
      color: var(--ink-2); box-shadow: var(--shadow-sm); max-width: 260px;
    }
    .filter-chip .chip-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .filter-chip .chip-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .filter-chip .chip-x {
      background: none; border: none; cursor: pointer;
      width: 18px; height: 18px; border-radius: 50%; padding: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-3); font-size: .9rem; transition: background .12s, color .12s;
    }
    .filter-chip .chip-x:hover { background: #fee2e2; color: #dc2626; }

    /* Input + boutons dans la section Proximité */
    #prox-input-row { display: flex; gap: 6px; align-items: center; }
    #prox-input {
      flex: 1; border: 1px solid var(--line); border-radius: var(--radius);
      padding: 7px 10px; font-size: 13px; font-family: inherit;
      background: var(--panel); color: var(--ink); outline: none; min-width: 0;
    }
    #prox-input:focus          { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    #prox-input::placeholder   { color: var(--ink-3); }
    #prox-apply, #prox-clear {
      width: 32px; height: 32px; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--panel);
      color: var(--ink-2); display: grid; place-items: center;
      flex-shrink: 0; transition: all .14s;
    }
    #prox-apply:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    #prox-clear:hover { border-color: #dc2626; color: #dc2626; background: #fee2e2; }
    #prox-status { font-size: .75rem; color: var(--ink-3); min-height: 1em; }
    #prox-status.error { color: #dc2626; }
    #prox-status.ok    { color: var(--accent); }

    /* Bouton géolocalisation (dans .search) */
    #geo-btn {
      border: 0; background: transparent; color: var(--ink-3); padding: 4px;
      border-radius: 6px; display: grid; place-items: center;
      flex-shrink: 0; transition: color .14s;
    }
    #geo-btn:hover { color: var(--accent); }

    /* Clusters Leaflet */
    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
      background-color: color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background-color: var(--accent); color: var(--accent-ink);
      font-family: var(--font-display); font-weight: 600; font-size: 12px;
    }

    /* Tooltip nom marqueur */
    .leaflet-tooltip.mm-name-tip {
      background: var(--panel); color: var(--ink);
      border: 1px solid var(--line); border-radius: var(--radius-pill);
      padding: 4px 11px; font-family: var(--font-body); font-size: .78rem;
      font-weight: 600; box-shadow: var(--shadow); white-space: nowrap;
    }
    .leaflet-tooltip.mm-name-tip::before { display: none; }

    /* Tri tableau */
    #data-table th.sorted { color: var(--accent); }
    #data-table th .sort-icon {
      color: var(--ink-3); margin-left: 4px;
      display: inline-flex; vertical-align: middle;
    }
    #data-table th .sort-icon svg { width: 13px; height: 13px; }

    /* Bouton solo discret dans chaque tchip */
    .tchip .solo-btn {
      position: absolute; right: 44px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; border-radius: 50%; padding: 0;
      border: 1.5px solid var(--line-strong); background: var(--panel-2);
      cursor: pointer; opacity: 0; transition: opacity .15s;
      display: flex; align-items: center; justify-content: center;
      font-size: .5rem; font-weight: 700; color: var(--ink-3);
      font-family: var(--font-label); letter-spacing: 0;
    }
    .tchip:hover .solo-btn { opacity: 1; }
    .tchip .solo-btn:hover  { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    /* Responsive : chips plus haut sur mobile (sous .mobile-filter) */
    @media (max-width: 860px) {
      #active-chips { left: 12px; right: 12px; top: 60px; }
    }
  </style>
</head>

<body class="app">

<!-- ═══ EN-TÊTE ═══ -->
<header class="hdr">
  <div class="brand">
    <div class="brand-mark">
      <span class="ic" data-icon="recycleur" data-size="19" data-sw="1.7"></span>
    </div>
    <div class="brand-txt">
      <span class="t">Acteurs plastiques</span>
      <span class="s">Cartographie de la filière de recyclage</span>
    </div>
  </div>

  <div class="seg" id="view-toggle">
    <button class="on" data-view="carte">
      <span class="ic" data-icon="map" data-size="15"></span>
      <span class="lbl">Carte</span>
    </button>
    <button data-view="liste">
      <span class="ic" data-icon="list" data-size="15"></span>
      <span class="lbl">Liste</span>
    </button>
    <button data-view="tableau">
      <span class="ic" data-icon="table" data-size="15"></span>
      <span class="lbl">Tableau</span>
    </button>
  </div>

  <div class="hdr-spacer"></div>

  <div class="hdr-stat">
    <span class="n" id="hdr-count">—</span>
    <span class="l" id="hdr-total"></span>
  </div>
</header>

<!-- ═══ CORPS ═══ -->
<div class="body">

  <!-- SIDEBAR -->
  <aside class="side" id="sidebar">
    <div class="side-scroll">

      <!-- Titre + reset -->
      <div class="side-top">
        <div class="ttl">
          <span class="ic" data-icon="sliders" data-size="17"></span>
          <h2>Filtres</h2>
        </div>
        <button class="reset-btn" id="reset-btn">
          <span class="ic" data-icon="reset" data-size="13"></span>
          Réinitialiser
        </button>
      </div>

      <!-- Recherche -->
      <div class="search" id="search-wrap">
        <span class="ic" data-icon="search" data-size="17"></span>
        <input type="text" id="search-input"
               placeholder="Rechercher un acteur, une commune…"
               autocomplete="off">
        <button id="geo-btn" title="Centrer sur ma position">
          <span class="ic" data-icon="crosshair" data-size="15"></span>
        </button>
        <button class="clr" id="search-clear" style="display:none" title="Effacer">
          <span data-icon="close" data-size="14"></span>
        </button>
      </div>

      <!-- Filtres type d'acteur (pastilles tchip) -->
      <div class="fgroup">
        <div class="fgroup-hd">
          <span class="label-kicker">Type d'acteur</span>
          <button class="reset-btn" id="select-all-types" style="display:none">Tout afficher</button>
        </div>
        <div class="types" id="type-filter-container"></div>
      </div>

      <!-- Filtres résines (pills rpill) -->
      <div class="fgroup">
        <div class="fgroup-hd">
          <span class="label-kicker">Résines gérées</span>
        </div>
        <div class="resines" id="resine-filter-container"></div>
      </div>

      <!-- Proximité -->
      <div class="prox" id="proximity-section">
        <div class="prox-hd">
          <div class="lt">
            <span class="ic" data-icon="crosshair" data-size="16"></span>
            <b>Proximité</b>
          </div>
          <button class="switch" id="prox-switch"
                  title="Activer / désactiver le filtre de proximité"></button>
        </div>
        <div id="prox-input-row">
          <input type="text" id="prox-input" list="commune-list"
                 placeholder="Commune (ex : Caen)" autocomplete="off">
          <button id="prox-apply" title="Appliquer le filtre">
            <span class="ic" data-icon="search" data-size="15"></span>
          </button>
          <button id="prox-clear" title="Retirer le filtre" style="display:none">
            <span class="ic" data-icon="close" data-size="14"></span>
          </button>
        </div>
        <datalist id="commune-list"></datalist>
        <div class="radius-wrap">
          <div class="radius-top">
            <span class="label-kicker">Rayon</span>
            <span class="v">
              <span id="prox-radius-val">30</span><small>km</small>
            </span>
          </div>
          <input type="range" class="rng" id="prox-radius"
                 min="5" max="200" step="5" value="30">
        </div>
        <div id="prox-status"></div>
      </div>

    </div><!-- /.side-scroll -->
  </aside>

  <!-- Poignée collapse (sibling de aside → sélecteur CSS .side.collapsed ~ .side-handle) -->
  <button class="side-handle" id="collapse-btn"
          title="Réduire / étendre le panneau des filtres">
    <span class="ic" data-icon="chevronLeft" data-size="16"></span>
  </button>

  <!-- CONTENU -->
  <div class="content" id="map-container">

    <!-- Carte Leaflet -->
    <div id="map" class="map"></div>

    <!-- Chips filtres actifs -->
    <div id="active-chips"></div>

    <!-- Contrôles carte – haut droite -->
    <div class="map-ctrl tr">
      <div class="basemap" id="basemap-ctrl">
        <button class="on" data-bm="osm">
          <span class="ic" data-icon="map" data-size="14"></span>OSM
        </button>
        <button data-bm="carto">Plan</button>
        <button data-bm="satellite">
          <span class="ic" data-icon="layers" data-size="14"></span>Satellite
        </button>
      </div>
      <div class="zoomer">
        <button id="zoom-in"  title="Zoom +">
          <span class="ic" data-icon="plus"  data-size="16"></span>
        </button>
        <button id="zoom-out" title="Zoom −">
          <span class="ic" data-icon="minus" data-size="16"></span>
        </button>
      </div>
    </div>

    <!-- Légende – bas gauche -->
    <div class="map-ctrl br">
      <div class="legend" id="legend">
        <h5>Légende</h5>
        <ul id="legend-body"></ul>
      </div>
    </div>

    <!-- Vue Liste -->
    <div id="list-panel" class="view-panel overlay">
      <div class="view-bar" id="list-hdr">
        <span class="cnt" id="list-count"></span>
      </div>
      <div class="ov-scroll">
        <div class="list" id="cards-grid"></div>
      </div>
    </div>

    <!-- Vue Tableau -->
    <div id="table-panel" class="view-panel overlay">
      <div class="view-bar" id="table-hdr">
        <span class="cnt" id="table-count"></span>
        <button class="dl-btn" id="csv-export-btn"
                title="Exporter les résultats filtrés en CSV">
          <span class="ic" data-icon="download" data-size="14"></span>CSV
        </button>
      </div>
      <div class="ov-scroll">
        <div class="table-wrap">
          <table class="tbl" id="data-table">
            <thead>
              <tr>
                <th data-col="nom">
                  Nom<span class="ic sort-icon" data-icon="sort" data-size="13"></span>
                </th>
                <th data-col="type_acteur">
                  Type<span class="ic sort-icon" data-icon="sort" data-size="13"></span>
                </th>
                <th data-col="commune">
                  Commune<span class="ic sort-icon" data-icon="sort" data-size="13"></span>
                </th>
                <th data-col="type_resine">
                  Résines<span class="ic sort-icon" data-icon="sort" data-size="13"></span>
                </th>
                <th data-col="distance" class="col-distance">
                  Distance<span class="ic sort-icon" data-icon="sort" data-size="13"></span>
                </th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Bouton mobile – ouvrir les filtres -->
    <button class="mobile-filter" id="toggle-btn">
      <span class="ic" data-icon="sliders" data-size="15"></span>Filtres
    </button>

  </div><!-- /.content -->

  <!-- Voile semi-transparent (mobile, ferme la sidebar) -->
  <div class="scrim" id="scrim" style="display:none"></div>

</div><!-- /.body -->

<!-- ═══ SCRIPTS ═══ -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
/* ════════════════════════════════════════
   ICÔNES — remplacement des [data-icon]
════════════════════════════════════════ */
function initIcons() {
  document.querySelectorAll('[data-icon]').forEach(el => {
    const name  = el.dataset.icon;
    const size  = el.dataset.size || 18;
    const sw    = el.dataset.sw   || 1.7;
    const inner = window.ICONS[name] || '';
    el.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none"
      stroke="currentColor" stroke-width="${sw}"
      stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  });
}
initIcons();

/* ════════════════════════════════════════
   CONFIG
════════════════════════════════════════ */
const CONFIG = {
  dataUrl:   'data/acteurs.json',
  mapCenter: [49.1, 0.3],
  mapZoom:   8,
  filterFields: [
    { key: 'type_acteur', label: "Type d'acteur",  isArray: true },
    { key: 'type_resine', label: 'Résines gérées', isArray: true }
  ],
  acteurConfig: {
    'Broyeur':      { color: '#E07A1F', cssVar: '--t-broyeur',   label: 'Broyeur' },
    'Recycleur':    { color: '#0E8C53', cssVar: '--t-recycleur', label: 'Recycleur' },
    'Trieur':       { color: '#2563EB', cssVar: '--t-trieur',    label: 'Trieur' },
    'Négociant':    { color: '#7C5CFC', cssVar: '--t-negociant', label: 'Négociant' },
    'Plasturgiste': { color: '#1e40af', cssVar: null,            label: 'Plasturgiste' },
    'Collecteur':   { color: '#0d9488', cssVar: null,            label: 'Collecteur' },
    'Autres':       { color: '#6b7280', cssVar: null,            label: 'Autres' },
    'default':      { color: '#6b7280', cssVar: null,            label: '?' }
  }
};

/* Mapping type (clé capitalisée) → clé icons.js (minuscule, sans accent) */
const TYPE_ICON_KEY = {
  'Broyeur':   'broyeur',
  'Recycleur': 'recycleur',
  'Trieur':    'trieur',
  'Négociant': 'negociant'
};

/* SVG de secours pour types hors icons.js */
const ACTEUR_SVG_FALLBACK = {
  'Plasturgiste': '<path d="M12 3l8 5v8l-8 5-8-5V8l8-5z"/>',
  'Collecteur':   '<path d="M1 16V5a1 1 0 011-1h12v12M14 9h4l3 3v4h-3M5.5 19a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM17.5 19a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/>',
  'Autres':       '<circle cx="6" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/>'
};

function acteurSvgInner(type) {
  const key = TYPE_ICON_KEY[type];
  if (key && window.ICONS[key]) return window.ICONS[key];
  return ACTEUR_SVG_FALLBACK[type] || ACTEUR_SVG_FALLBACK['Autres'];
}

function iconFromAtelier(type, size = 18, sw = 2.2) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none"
    stroke="currentColor" stroke-width="${sw}"
    stroke-linecap="round" stroke-linejoin="round">${acteurSvgInner(type)}</svg>`;
}

function typeColor(type) {
  const info = CONFIG.acteurConfig[type] || CONFIG.acteurConfig['default'];
  return info.cssVar ? `var(${info.cssVar})` : info.color;
}

const ACTEUR_ORDER = ['Collecteur','Trieur','Broyeur','Recycleur','Plasturgiste','Négociant','Autres'];
function sortTypes(types) {
  return [...(types || [])].sort((a, b) => {
    const ia = ACTEUR_ORDER.indexOf(a), ib = ACTEUR_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}

/* ════════════════════════════════════════
   CARTE
════════════════════════════════════════ */
const map = L.map('map', { zoomControl: false }).setView(CONFIG.mapCenter, CONFIG.mapZoom);

const basemaps = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> France',
    maxZoom: 20
  }),
  carto: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> © <a href="https://carto.com">CARTO</a>',
    maxZoom: 20
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri, Maxar, GeoEye',
    maxZoom: 18
  })
};
let currentBasemap = 'osm';
basemaps.osm.addTo(map);

const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 60 });
map.addLayer(clusterGroup);

/* Basemap switcher */
document.querySelectorAll('#basemap-ctrl button').forEach(btn => {
  btn.addEventListener('click', () => {
    const bm = btn.dataset.bm;
    if (bm === currentBasemap) return;
    map.removeLayer(basemaps[currentBasemap]);
    map.addLayer(basemaps[bm]);
    currentBasemap = bm;
    document.querySelectorAll('#basemap-ctrl button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  });
});

/* Zoom custom */
document.getElementById('zoom-in').addEventListener('click',  () => map.zoomIn());
document.getElementById('zoom-out').addEventListener('click', () => map.zoomOut());

/* ════════════════════════════════════════
   ÉTAT
════════════════════════════════════════ */
let allData         = [];
let activeFilters   = {};
let currentView     = 'carte';
let sortCol         = null;
let sortDir         = 1;
let radiusFilter    = null;
let radiusCircle    = null;
let countEls        = {};
let suppressUrlSync = false;

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function actorDistance(a) {
  if (!radiusFilter || a.lat == null || a.lng == null) return null;
  return haversineKm(radiusFilter.lat, radiusFilter.lng, a.lat, a.lng);
}

/* ════════════════════════════════════════
   SÉLECTEUR DE VUE
════════════════════════════════════════ */
const listPanel  = document.getElementById('list-panel');
const tablePanel = document.getElementById('table-panel');

document.querySelectorAll('#view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.view;
    if (view === currentView) return;
    currentView = view;
    document.querySelectorAll('#view-toggle button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    listPanel.classList.remove('open');
    tablePanel.classList.remove('open');
    if (view === 'liste')   { listPanel.classList.add('open');  renderCards(); }
    if (view === 'tableau') { tablePanel.classList.add('open'); renderTable(); }
    if (view === 'carte')   { setTimeout(() => map.invalidateSize(), 50); }
    syncUrl();
  });
});

/* ════════════════════════════════════════
   MARQUEURS — forme Galet (.mk-blob)
════════════════════════════════════════ */
function markerHTML(typeActeur) {
  const types    = sortTypes(Array.isArray(typeActeur) ? typeActeur : [typeActeur].filter(Boolean));
  const mainType = types[0] || 'default';
  const c        = typeColor(mainType);
  const svg      = iconFromAtelier(mainType, 16, 2.2);
  return `<div class="mk" style="--c:${c}"><div class="mk-blob"><span class="ic">${svg}</span></div></div>`;
}

function makeIcon(typeActeur) {
  return L.divIcon({
    className:   'mk-wrap',
    html:        markerHTML(typeActeur),
    iconSize:    [32, 32],
    iconAnchor:  [16, 16],
    popupAnchor: [0, -18]
  });
}

/* ════════════════════════════════════════
   POPUP
════════════════════════════════════════ */
function buildPopup(a) {
  const types    = sortTypes(Array.isArray(a.type_acteur) ? a.type_acteur : [a.type_acteur].filter(Boolean));
  const mainType = types[0] || 'default';
  const c        = typeColor(mainType);
  const resBadges = (a.type_resine || []).map(r => `<span>${r}</span>`).join('');
  const locParts  = [a.commune, a.code_postal].filter(Boolean).join(' ');
  const pinSvg = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none"
    stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
    stroke-linejoin="round">${window.ICONS.pin}</svg>`;
  const extSvg = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none"
    stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
    stroke-linejoin="round">${window.ICONS.external}</svg>`;
  return `<div class="pop">
    <span class="pop-type" style="background:${c}">${types.join(' · ')}</span>
    <h4>${a.nom}</h4>
    ${locParts ? `<div class="loc">${pinSvg}${locParts}</div>` : ''}
    ${resBadges ? `<div class="res">${resBadges}</div>` : ''}
    ${a.site_web ? `<div class="loc" style="margin-top:6px">
      ${extSvg}<a href="${a.site_web}" target="_blank" rel="noopener"
        style="color:var(--accent);text-decoration:none;font-size:11.5px;word-break:break-all">${a.site_web}</a>
    </div>` : ''}
  </div>`;
}

/* ════════════════════════════════════════
   FILTRES — génération tchip + rpill
════════════════════════════════════════ */
function buildFilters() {
  const typesEl   = document.getElementById('type-filter-container');
  const resinesEl = document.getElementById('resine-filter-container');
  typesEl.innerHTML = '';
  resinesEl.innerHTML = '';
  countEls = {};

  /* ── Types d'acteur → .tchip ── */
  const typeVals = uniqueValues('type_acteur', true);
  activeFilters['type_acteur'] = new Set(typeVals);

  const checkSvg = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none"
    stroke="currentColor" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round">${window.ICONS.check}</svg>`;

  typeVals.forEach(val => {
    const info     = CONFIG.acteurConfig[val] || CONFIG.acteurConfig['default'];
    const c        = info.cssVar ? `var(${info.cssVar})` : info.color;
    const count    = countValue('type_acteur', val, true);
    const iconHtml = iconFromAtelier(val, 18, 2);

    const btn = document.createElement('button');
    btn.className = 'tchip';
    btn.dataset.key = 'type_acteur';
    btn.dataset.val = val;
    btn.style.setProperty('--c', c);
    btn.innerHTML = `
      <span class="dot">${iconHtml}</span>
      <span class="tx">
        <span class="nm">${val}</span>
        <span class="ct">${count} acteur${count > 1 ? 's' : ''}</span>
      </span>
      <span class="tick">${checkSvg}</span>
      <button class="solo-btn" tabindex="-1" title="Afficher uniquement « ${val} »">1</button>
    `;

    btn.addEventListener('click', e => {
      if (e.target.closest('.solo-btn')) return;
      const active = activeFilters['type_acteur'];
      if (active.has(val)) {
        active.delete(val);
        if (active.size === 0) activeFilters['type_acteur'] = new Set(typeVals);
      } else {
        active.add(val);
      }
      syncTchipStates();
      updateView();
    });

    btn.querySelector('.solo-btn').addEventListener('click', e => {
      e.stopPropagation();
      soloFilter('type_acteur', val);
    });

    typesEl.appendChild(btn);
    countEls[`type_acteur:${val}`] = btn.querySelector('.ct');
  });

  /* ── Résines → .rpill ── */
  const resineVals = uniqueValues('type_resine', true);
  activeFilters['type_resine'] = new Set(resineVals);

  resineVals.forEach(val => {
    const btn = document.createElement('button');
    btn.className = 'rpill';
    btn.dataset.key = 'type_resine';
    btn.dataset.val = val;
    btn.innerHTML = `<span class="ic">${checkSvg}</span>${val}`;

    btn.addEventListener('click', () => {
      const active = activeFilters['type_resine'];
      if (active.has(val)) {
        active.delete(val);
        if (active.size === 0) activeFilters['type_resine'] = new Set(resineVals);
      } else {
        active.add(val);
      }
      syncRpillStates();
      updateView();
    });

    resinesEl.appendChild(btn);
  });
}

/* ── Synchronisation des états visuels ── */
function syncTchipStates() {
  const key    = 'type_acteur';
  const all    = uniqueValues(key, true);
  const active = activeFilters[key] || new Set();
  const allOn  = active.size === all.length;
  document.querySelectorAll(`.tchip[data-key="${key}"]`).forEach(chip => {
    chip.classList.remove('on', 'off');
    chip.classList.add(active.has(chip.dataset.val) ? 'on' : 'off');
  });
  const allBtn = document.getElementById('select-all-types');
  if (allBtn) allBtn.style.display = allOn ? 'none' : '';
}

function syncRpillStates() {
  const key    = 'type_resine';
  const all    = uniqueValues(key, true);
  const active = activeFilters[key] || new Set();
  const allOn  = active.size === all.length;
  document.querySelectorAll(`.rpill[data-key="${key}"]`).forEach(pill => {
    pill.classList.toggle('on', !allOn && active.has(pill.dataset.val));
  });
}

function syncFilterStates() { syncTchipStates(); syncRpillStates(); }

/* ════════════════════════════════════════
   FILTRAGE (logique inchangée)
════════════════════════════════════════ */
function uniqueValues(field, isArray) {
  const s = new Set();
  allData.forEach(a => {
    if (isArray && Array.isArray(a[field])) a[field].forEach(v => s.add(v));
    else if (a[field]) s.add(a[field]);
  });
  return [...s].sort();
}
function countValue(field, val, isArray) {
  return allData.filter(a => {
    if (isArray && Array.isArray(a[field])) return a[field].includes(val);
    return a[field] === val;
  }).length;
}
function getFiltered(opts = {}) {
  const skipKey = opts.skipKey || null;
  const q = searchInput.value.toLowerCase().trim();
  return allData.filter(a => {
    if (q) {
      const hay = [
        a.nom, a.commune, a.adresse, a.description,
        ...(Array.isArray(a.type_acteur) ? a.type_acteur : [a.type_acteur]),
        ...(Array.isArray(a.type_resine) ? a.type_resine : [a.type_resine])
      ].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    for (const { key, isArray } of CONFIG.filterFields) {
      if (key === skipKey) continue;
      const active = activeFilters[key];
      if (!active || active.size === 0) return false;
      if (isArray) { if (!(a[key] || []).some(v => active.has(v))) return false; }
      else         { if (!active.has(a[key])) return false; }
    }
    if (radiusFilter) {
      if (a.lat == null || a.lng == null) return false;
      if (haversineKm(radiusFilter.lat, radiusFilter.lng, a.lat, a.lng) > radiusFilter.km) return false;
    }
    return true;
  });
}
function dynamicCount(key, val, isArray) {
  const base = getFiltered({ skipKey: key });
  if (isArray) return base.filter(a => (a[key] || []).includes(val)).length;
  return base.filter(a => a[key] === val).length;
}
function refreshCounts() {
  uniqueValues('type_acteur', true).forEach(val => {
    const el = countEls[`type_acteur:${val}`];
    if (!el) return;
    const cnt = dynamicCount('type_acteur', val, true);
    el.textContent = `${cnt} acteur${cnt > 1 ? 's' : ''}`;
  });
}
function soloFilter(key, val) {
  activeFilters[key] = new Set([val]);
  syncFilterStates();
  updateView();
}

/* ════════════════════════════════════════
   CHIPS ACTIFS AU-DESSUS DE LA CARTE
════════════════════════════════════════ */
function renderActiveChips() {
  const bar = document.getElementById('active-chips');
  bar.innerHTML = '';

  const q = searchInput.value.trim();
  if (q) bar.appendChild(makeChip({
    label: `"${q}"`,
    onRemove: () => { searchInput.value = ''; searchClear.style.display = 'none'; updateView(); }
  }));

  CONFIG.filterFields.forEach(({ key, isArray }) => {
    const all    = uniqueValues(key, isArray);
    const active = activeFilters[key] || new Set();
    all.filter(v => !active.has(v)).forEach(val => {
      const color = key === 'type_acteur'
        ? (CONFIG.acteurConfig[val] || CONFIG.acteurConfig.default).color
        : '#0e7490';
      bar.appendChild(makeChip({
        dot: color,
        label: `Sans : ${val}`,
        onRemove: () => {
          activeFilters[key].add(val);
          syncFilterStates();
          updateView();
        }
      }));
    });
  });

  if (radiusFilter) bar.appendChild(makeChip({
    label: `≤ ${radiusFilter.km} km de ${radiusFilter.commune}`,
    onRemove: () => clearRadius()
  }));
}

function makeChip({ dot = null, label, onRemove }) {
  const el  = document.createElement('div');
  el.className = 'filter-chip';
  if (dot) {
    const d = document.createElement('span');
    d.className = 'chip-dot'; d.style.background = dot; el.appendChild(d);
  }
  const lab = document.createElement('span');
  lab.className = 'chip-label'; lab.textContent = label; lab.title = label;
  el.appendChild(lab);
  const btn = document.createElement('button');
  btn.className = 'chip-x'; btn.type = 'button'; btn.textContent = '×'; btn.title = 'Retirer';
  btn.addEventListener('click', onRemove);
  el.appendChild(btn);
  return el;
}

/* ════════════════════════════════════════
   RENDER : TABLEAU
════════════════════════════════════════ */
function getSortedFiltered() {
  let filtered = getFiltered();
  const col = sortCol || (radiusFilter ? 'distance' : null);
  if (col) {
    const dir = sortCol ? sortDir : 1;
    filtered = [...filtered].sort((a, b) => {
      const va = colVal(a, col), vb = colVal(b, col);
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'fr', { sensitivity: 'base' }) * dir;
    });
  }
  return filtered;
}
function colVal(a, col) {
  if (col === 'nom')         return a.nom || '';
  if (col === 'type_acteur') return (Array.isArray(a.type_acteur) ? a.type_acteur[0] : a.type_acteur) || '';
  if (col === 'commune')     return a.commune || a.adresse || '';
  if (col === 'type_resine') return (a.type_resine || []).join(',');
  if (col === 'distance')    { const d = actorDistance(a); return d == null ? Infinity : d; }
  return '';
}
function renderTable() {
  const filtered = getSortedFiltered();
  const countEl  = document.getElementById('table-count');
  if (countEl) countEl.innerHTML = `<b>${filtered.length}</b> acteur${filtered.length > 1 ? 's' : ''}`;
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  filtered.forEach(a => {
    const types    = sortTypes(Array.isArray(a.type_acteur) ? a.type_acteur : [a.type_acteur || '']);
    const mainType = types[0] || 'default';
    const c        = typeColor(mainType);
    const iconHtml = iconFromAtelier(mainType, 15, 2.2);
    const dist     = actorDistance(a);
    const resBadges = (a.type_resine || []).map(r => `<span>${r}</span>`).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><div class="tbl-name">
        <span class="tbl-dot" style="--c:${c}">${iconHtml}</span>
        <b>${a.nom}</b>
      </div></td>
      <td><span class="tbl-badge"
        style="background:color-mix(in srgb,${c} 12%,var(--panel));color:${c}">${types.join(' · ')}</span></td>
      <td>${a.commune || a.adresse || '—'}<span class="faint">${a.code_postal ? ' (' + a.code_postal + ')' : ''}</span></td>
      <td><div class="tbl-res">${resBadges || '<span class="faint">—</span>'}</div></td>
      <td class="col-distance"><span class="tbl-dist${dist == null ? ' faint' : ''}">${dist != null ? dist.toFixed(1) + ' km' : '—'}</span></td>`;
    tbody.appendChild(tr);
  });
}

/* Tri du tableau */
document.querySelectorAll('#data-table th').forEach(th => {

    const col = th.dataset.col;

/* ════════════════════════════════════════
   FILTRE PROXIMITÉ / RAYON
════════════════════════════════════════ */
function updateProxSwitch() {
  const sw   = document.getElementById('prox-switch');
  const prox = document.getElementById('proximity-section');
  if (sw)   sw.classList.toggle('on',   !!radiusFilter);
  if (prox) prox.classList.toggle('on', !!radiusFilter);
}

function drawRadiusCircle(recenter = true) {
  if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
  if (!radiusFilter) return;
  const accent = getComputedStyle(document.documentElement)
                   .getPropertyValue('--accent').trim() || '#0E8C53';
  radiusCircle = L.circle([radiusFilter.lat, radiusFilter.lng], {
    radius:      radiusFilter.km * 1000,
    color:       accent,
    weight:      2,
    dashArray:   '6 4',
    fillColor:   accent,
    fillOpacity: 0.07,
    interactive: false
  }).addTo(map);
  if (recenter) map.fitBounds(radiusCircle.getBounds(), { padding: [40, 40], maxZoom: 12 });
}

function findLocalCommune(name) {
  const target = name.trim().toLowerCase();
  if (!target) return null;
  const hit = allData.find(a => a.commune && a.commune.toLowerCase() === target
                                  && a.lat != null && a.lng != null);
  if (hit) return { commune: hit.commune, lat: hit.lat, lng: hit.lng };
  return null;
}
async function geocodeCommune(name) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name + ', France')}&format=json&limit=1&countrycodes=fr`;
  const res = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const arr = await res.json();
  if (!arr.length) throw new Error('Commune introuvable');
  return { commune: name, lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) };
}
async function setRadius(commune, km, opts = {}) {
  const status = document.getElementById('prox-status');
  status.className = ''; status.textContent = '';
  if (!commune) return;
  let resolved = findLocalCommune(commune);
  if (!resolved) {
    status.textContent = 'Recherche…';
    try       { resolved = await geocodeCommune(commune); }
    catch (e) { status.className = 'error'; status.textContent = 'Commune introuvable'; return; }
  }
  radiusFilter = { commune: resolved.commune, lat: resolved.lat, lng: resolved.lng, km };
  document.body.classList.add('has-radius');
  document.getElementById('prox-clear').style.display = '';
  status.className = 'ok'; status.textContent = `📍 ${resolved.commune}`;
  drawRadiusCircle(opts.recenter !== false);
  updateProxSwitch();
  updateView();
}
function clearRadius(opts = {}) {
  radiusFilter = null;
  if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
  document.body.classList.remove('has-radius');
  document.getElementById('prox-input').value = '';
  document.getElementById('prox-clear').style.display = 'none';
  const status = document.getElementById('prox-status');
  status.className = ''; status.textContent = '';
  updateProxSwitch();
  if (!opts.skipUpdate) updateView();
}

document.getElementById('prox-apply').addEventListener('click', () => {
  const v  = document.getElementById('prox-input').value.trim();
  const km = parseInt(document.getElementById('prox-radius').value, 10);
  if (v) setRadius(v, km);
});
document.getElementById('prox-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('prox-apply').click(); }
});
document.getElementById('prox-clear').addEventListener('click', () => clearRadius());

document.getElementById('prox-switch').addEventListener('click', () => {
  if (radiusFilter) clearRadius();
  else {
    const v  = document.getElementById('prox-input').value.trim();
    const km = parseInt(document.getElementById('prox-radius').value, 10);
    if (v) setRadius(v, km);
  }
});

const radiusSlider = document.getElementById('prox-radius');
const radiusLabel  = document.getElementById('prox-radius-val');
radiusSlider.addEventListener('input', () => {
  radiusLabel.textContent = radiusSlider.value;
});
radiusSlider.addEventListener('change', () => {
  if (radiusFilter) {
    radiusFilter.km = parseInt(radiusSlider.value, 10);
    drawRadiusCircle(false);
    updateView();
  }
});

/* ════════════════════════════════════════
   EXPORT CSV (logique inchangée)
════════════════════════════════════════ */
function csvCell(v) {
  if (v == null) return '';
  const s = String(v);
  if (/[",;\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportCsv() {
  const rows      = getSortedFiltered();
  const hasRadius = !!radiusFilter;
  const headers   = ['Nom', "Type d'acteur", 'Commune', 'Code postal', 'Adresse',
                      'Résines', 'Téléphone', 'Email', 'Site web', 'Latitude', 'Longitude'];
  if (hasRadius) headers.push('Distance (km)');
  const lines = [headers.map(csvCell).join(';')];
  rows.forEach(a => {
    const cells = [
      a.nom, (a.type_acteur || []).join(', '),
      a.commune || '', a.code_postal || '', a.adresse || '',
      (a.type_resine || []).join(', '), a.telephone || '',
      a.email || '', a.site_web || '',
      a.lat != null ? a.lat : '', a.lng != null ? a.lng : ''
    ];
    if (hasRadius) cells.push(actorDistance(a)?.toFixed(2) ?? '');
    lines.push(cells.map(csvCell).join(';'));
  });
  const csv  = '﻿' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `acteurs-plastiques-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.getElementById('csv-export-btn').addEventListener('click', exportCsv);

/* ════════════════════════════════════════
   URL SYNC (logique inchangée)
════════════════════════════════════════ */
function syncUrl() {
  if (suppressUrlSync) return;
  const params = new URLSearchParams();
  const q = searchInput.value.trim();
  if (q) params.set('q', q);
  CONFIG.filterFields.forEach(({ key, isArray }) => {
    const all    = uniqueValues(key, isArray);
    const active = activeFilters[key] || new Set();
    if (active.size !== all.length) {
      const short = key === 'type_acteur' ? 'types' : key === 'type_resine' ? 'resines' : key;
      params.set(short, [...active].join(','));
    }
  });
  if (currentView !== 'carte') params.set('view', currentView);
  if (radiusFilter) {
    params.set('commune', radiusFilter.commune);
    params.set('radius',  String(radiusFilter.km));
  }
  if (sortCol) params.set('sort', `${sortCol}:${sortDir === 1 ? 'asc' : 'desc'}`);
  const qs = params.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

function applyUrlState() {
  const params = new URLSearchParams(location.search);
  suppressUrlSync = true;

  const q = params.get('q');
  if (q) { searchInput.value = q; searchClear.style.display = ''; }

  const keyMap = { types: 'type_acteur', resines: 'type_resine' };
  Object.entries(keyMap).forEach(([short, key]) => {
    if (!params.has(short)) return;
    const all    = uniqueValues(key, CONFIG.filterFields.find(f => f.key === key)?.isArray || false);
    const wanted = new Set(params.get(short).split(',').filter(Boolean));
    const next   = new Set(all.filter(v => wanted.has(v)));
    if (next.size > 0) activeFilters[key] = next;
  });

  const view = params.get('view');
  if (view && ['carte', 'liste', 'tableau'].includes(view) && view !== currentView) {
    currentView = view;
    document.querySelectorAll('#view-toggle button').forEach(b => b.classList.remove('on'));
    const vBtn = document.querySelector(`#view-toggle button[data-view="${view}"]`);
    if (vBtn) vBtn.classList.add('on');
    listPanel.classList.remove('open');
    tablePanel.classList.remove('open');
    if (view === 'liste')   listPanel.classList.add('open');
    if (view === 'tableau') tablePanel.classList.add('open');
  }

  const sortP = params.get('sort');
  if (sortP) {
    const [col, dir] = sortP.split(':');
    sortCol = col; sortDir = dir === 'desc' ? -1 : 1;
    const th = document.querySelector(`#data-table th[data-col="${col}"]`);
    if (th) th.classList.add('sorted');
  }

  const commune = params.get('commune');
  const radius  = params.get('radius');
  suppressUrlSync = false;
  syncFilterStates();

  if (commune && radius) {
    const km = parseInt(radius, 10);
    document.getElementById('prox-input').value = commune;
    radiusSlider.value          = String(km);
    radiusLabel.textContent     = km;
    setRadius(commune, km, { recenter: true });
  }
}

/* ════════════════════════════════════════
   LÉGENDE
════════════════════════════════════════ */
function buildLegend() {
  const body = document.getElementById('legend-body');
  body.innerHTML = ACTEUR_ORDER
    .filter(t => CONFIG.acteurConfig[t])
    .map(t => {
      const info = CONFIG.acteurConfig[t];
      const c    = info.cssVar ? `var(${info.cssVar})` : info.color;
      return `<li><span class="sw" style="background:${c}"></span><b>${info.label}</b></li>`;
    }).join('');
}

/* ════════════════════════════════════════
   CHARGEMENT DES DONNÉES
════════════════════════════════════════ */
fetch(CONFIG.dataUrl)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => {
    allData = data;
    buildFilters();
    buildCommuneList();
    buildLegend();
    applyUrlState();
    syncFilterStates();
    updateView();
  })
  .catch(err => {
    console.error('Erreur chargement JSON:', err);
    const hdrCount = document.getElementById('hdr-count');
    if (hdrCount) { hdrCount.textContent = '!'; hdrCount.style.color = '#ef4444'; }
  });
</script>
